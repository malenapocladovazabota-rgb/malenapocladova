<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="sq"><rect x="0" y="0" width="1024" height="1024"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="#6B2138"/>
    <!-- линованная бумага, едва заметная -->
    <g stroke="#FBF6EC" stroke-opacity="0.07" stroke-width="3">
      <line x1="0" y1="200" x2="1024" y2="200"/>
      <line x1="0" y1="304" x2="1024" y2="304"/>
      <line x1="0" y1="408" x2="1024" y2="408"/>
      <line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="0" y1="616" x2="1024" y2="616"/>
      <line x1="0" y1="720" x2="1024" y2="720"/>
      <line x1="0" y1="824" x2="1024" y2="824"/>
    </g>
    <!-- рамка печати -->
    <rect x="54" y="54" width="916" height="916" fill="none" stroke="#FBF6EC" stroke-opacity="0.9" stroke-width="9"/>
    <rect x="78" y="78" width="868" height="868" fill="none" stroke="#FBF6EC" stroke-opacity="0.42" stroke-width="3"/>

    <text x="512" y="286" text-anchor="middle" font-family="Liberation Sans Narrow" font-weight="bold"
          font-size="62" letter-spacing="26" fill="#FBF6EC" fill-opacity="0.72">КЛУБ</text>

    <!-- жёлтый мазок под монограммой -->
    <path d="M 292 754 C 420 722, 610 722, 736 756" stroke="#F5C63A" stroke-width="34"
          stroke-linecap="round" fill="none" opacity="0.95"/>

    <text x="512" y="672" text-anchor="middle" font-family="Lora" font-weight="600"
          font-size="430" fill="#FBF6EC">ПД</text>

    <text x="512" y="892" text-anchor="middle" font-family="Liberation Sans Narrow"
          font-size="52" letter-spacing="14" fill="#FBF6EC" fill-opacity="0.75">ПРОДВИЖЕНИЕ</text>
  </g>
</svg>
